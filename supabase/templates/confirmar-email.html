<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirme seu e-mail — Desk Events</title></head>
<body style="margin:0;background:#000;color:#f5f5f5;font-family:Arial,sans-serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:40px 16px">
    <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:100%;background:#0c0c0c;border:1px solid #303030;border-radius:20px"><tr><td style="padding:36px">
      <p style="font-size:24px;margin:0 0 32px;color:#f5f5f5"><strong>desk</strong>events</p>
      <h1 style="font-size:28px;line-height:1.2;color:#f5f5f5">Seu escritório está quase pronto.</h1>
      <p style="font-size:15px;line-height:1.7;color:#ababab">Confirme seu e-mail para começar a organizar sua equipe de agentes no Desk Events.</p>
      <p style="margin:30px 0"><a href="{{ .SiteURL }}/confirmar-email?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#c52232;border-radius:8px;color:#fff;text-decoration:none;padding:15px 22px;font-weight:bold">Confirmar meu e-mail</a></p>
      <p style="color:#ababab;font-size:12px;line-height:1.7">Se você não criou esta conta, pode ignorar esta mensagem.</p>
      <p style="border-top:1px solid #303030;padding-top:20px;color:#ababab;font-size:12px">Seu time conectado. Seu trabalho em movimento.</p>
    </td></tr></table>
  </td></tr></table>
</body></html>
